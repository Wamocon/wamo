[project]
name = "wamo-geraete"
version = "0.1.0"
description = "WAMO-Gerätedienst auf Sokrates-2: Bürogeräte (Server, Drucker, Scanner, Router, NAS, Fernseher, Lautsprecher, Steckdosen) über einen Unix-Socket für den Kern"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.2",
    "smbprotocol>=1.15",
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
