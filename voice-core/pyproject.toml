[project]
name = "wamo-voice-core"
version = "0.1.0"
description = "WAMO Voice-Core: Pipecat + Soniox STT/TTS + Claude"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[anthropic,mcp,runner,silero,soniox,webrtc]>=1.12,<2",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "tzdata>=2026.5",
    "pyjwt[crypto]>=2.10",
    "cryptography==50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["."]
python_files = ["test_*.py"]
