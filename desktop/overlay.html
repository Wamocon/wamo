<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>WAMO Stimmen-Rand</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      /* Lichtrahmen und Klickwelle (markierung.js): WMC-Rot, nie anklickbar */
      #rahmen, #welle { position: fixed; box-sizing: border-box; pointer-events: none; }
      #rahmen[hidden], #welle[hidden] { display: none; }
      #rahmen {
        border: 3px solid #F40E0E; border-radius: 8px; opacity: 0; transition: opacity 120ms ease-out;
        /* heller Saum außen, damit der Rahmen auch auf roten oder dunklen Fenstern erkennbar bleibt */
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.7), 0 0 22px 5px rgba(244, 14, 14, 0.45),
          inset 0 0 14px 2px rgba(244, 14, 14, 0.3);
      }
      #rahmen.an { opacity: 1; }
      #welle {
        width: 56px; height: 56px; margin: -28px 0 0 -28px; border: 3px solid #F40E0E; border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.7); opacity: 0;
      }
      #welle.an { animation: welle 800ms ease-out forwards; }
      @keyframes welle {
        0% { transform: scale(0.25); opacity: 0.95; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #rahmen { transition: none; }
        #welle.an { animation: none; opacity: 0.9; transform: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="edge"></canvas>
    <div id="rahmen" hidden></div>
    <div id="welle" hidden></div>
    <script src="overlay.js"></script>
    <script src="markierung.js"></script>
  </body>
</html>
