[project]
name = "wamo-labor-dienst"
version = "1.0.0"
description = "WAMO Labor-Dienst: Test-Jira des Testlabors (Vertrag Version 1, docs/labor-dienst-vertrag.md)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "langsam: läuft nur mit WAMO_LABOR_ECHTZEIT=1 (echte Schreibrate, 20 bis 25 Minuten)",
]
