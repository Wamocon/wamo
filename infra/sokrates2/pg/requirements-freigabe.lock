# Treiber und Bibliotheken des Freigabe-Dienstes (infra/sokrates2/anker/freigabe_dienst.py): psycopg 3 mit eingebauter libpq, PyJWT
# und cryptography (ES256-Prüfung), dazu deren Abhängigkeiten cffi und pycparser. Nur für Sokrates-2 (Ubuntu 24.04, aarch64, Python 3.12).
# Installation durch freigabe-einrichten.sh:
#   python3 -m pip install --no-deps --only-binary=:all: --require-hashes --target <ordner> -r requirements-freigabe.lock
# Jede Datei ist mit ihrer Prüfsumme festgehalten; pip lehnt alles andere ab. Von cryptography stehen alle aarch64-Wheels, die pip für
# Python 3.12 wählen kann (abi3 für cp311 und cp39, je manylinux2014, 2_28 und 2_34), damit die Wahl von pip nie an der Prüfsumme scheitert.
# Erneuern: Fassungen prüfen, Wheels mit pip download --only-binary=:all: --platform manylinux2014_aarch64 --python-version 3.12 laden,
# Prüfsummen aller in Frage kommenden Wheels (PyPI-Seite "Download files") hier eintragen.
